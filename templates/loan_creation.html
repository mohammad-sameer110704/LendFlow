<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrower Signup</title>
</head>
<body>

```
<main>
    <h1>Borrower Signup</h1>
    <p>Enter your details to create a loan account.</p>

    <form action="/loan" method="POST">

        <div>
            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                autocomplete="name"
                placeholder="Enter your full name"
                required
            >
        </div>

        <br>

        <div>
            <label for="phno">Phone Number</label>
            <input
                type="tel"
                id="phno"
                name="phno"
                autocomplete="tel"
                inputmode="numeric"
                pattern="[0-9]{10}"
                maxlength="10"
                placeholder="Enter 10-digit phone number"
                aria-describedby="phone-help"
                required
            >
            <small id="phone-help">Enter a 10-digit phone number.</small>
        </div>

        <br>

        <div>
            <label for="adhaar">Aadhaar Number</label>
            <input
                type="password"
                id="adhaar"
                name="adhaar"
                inputmode="numeric"
                pattern="[0-9]{12}"
                maxlength="12"
                placeholder="Enter 12-digit Aadhaar number"
                aria-describedby="aadhaar-help"
                required
            >
            <small id="aadhaar-help">Enter your 12-digit Aadhaar number.</small>
        </div>

        <br>

        <div>
            <label for="amount">Loan Amount (₹)</label>
            <input
                type="number"
                id="amount"
                name="amount"
                min="1"
                step="0.01"
                placeholder="Enter loan amount"
                required
            >
        </div>

        <br>

        <button type="submit">Create Loan</button>

    </form>
</main>
```

</body>
</html>
